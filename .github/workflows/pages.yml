name: Build and deploy AZEXAI

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate AZEXAI static pages
        env:
          BLOGGER_API_KEY: ${{ secrets.BLOGGER_API_KEY }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          SITE_URL: https://azexai.com
        run: node scripts/build.mjs

      - name: Run AZEXAI SEO Engine
        env:
          SITE_ORIGIN: https://azexai.com
        run: node seo-engine.mjs

      - name: Display SEO report
        run: |
          if [ -f seo-report.json ]; then
            cat seo-report.json
          else
            echo "seo-report.json was not generated."
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
