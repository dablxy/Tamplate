<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageMetaTitle">AZEXAI — Global Technology & Artificial Intelligence Authority</title>
  <meta id="pageMetaDesc" name="description" content="Global authority on artificial intelligence, frontier technology, software architecture, and digital transformation.">
  <link id="pageCanonical" rel="canonical" href="">

  <!-- Preconnects for Performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'">

  <style>
    :root {
      --bg-dark: #030712;
      --card-bg: rgba(13, 18, 30, 0.95);
      --cyan: #38bdf8;
      --cyan-bright: #0284c7;
      --slate-300: #cbd5e1;
      --slate-400: #94a3b8;
    }

    *, ::before, ::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      background-color: var(--bg-dark);
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Performance Optimized Layout Elements */
    .container {
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 1rem;
    }

    /* Clean Header */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(56, 189, 248, 0.1);
    }

    .nav-wrapper {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 70px;
    }

    .brand-logo {
      font-size: 1.5rem;
      font-weight: 900;
      text-transform: uppercase;
      color: #fff;
      text-decoration: none;
    }
    .brand-logo span.highlight { color: var(--cyan); }
    .brand-logo span.dot { color: #ef4444; }

    /* Category Bar Top */
    .top-sections {
      background: #000;
      padding: 0.5rem 0;
      font-size: 11px;
      font-weight: bold;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .top-sections a {
      color: var(--slate-400);
      text-decoration: none;
      margin: 0 8px;
    }
    .top-sections a:hover { color: #fff; }

    /* Featured Banner Card */
    .hero-card {
      background: linear-gradient(135deg, rgba(14, 165, 233, 0.1) 0%, rgba(99, 102, 241, 0.1) 100%);
      border-radius: 1rem;
      padding: 1.5rem;
      margin-bottom: 2rem;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }
    .hero-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }
    @media (min-width: 768px) {
      .hero-grid { grid-template-columns: 7fr 5fr; align-items: center; }
    }

    /* Grid Layout */
    .article-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
    }
    @media (min-width: 1024px) {
      .article-grid { grid-template-columns: repeat(3, 1fr); gap: 1.5rem; }
    }

    .card {
      background: var(--card-bg);
      border-radius: 0.75rem;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .card-img-wrapper {
      width: 100%;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 140px;
    }
    .card-img-wrapper img {
      width: 100%;
      height: auto;
      object-fit: contain;
      display: block;
    }

    .card-body {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    .card-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 0.5rem;
      line-height: 1.3;
    }
    .card-excerpt {
      font-size: 0.75rem;
      color: var(--slate-400);
      line-height: 1.5;
      margin-bottom: 1rem;
    }

    /* Article Content Typography Straightening */
    .prose { width: 100%; }
    .prose h1, .prose h2, .prose h3 { color: #fff; margin: 1.2rem 0 0.6rem; }
    .prose p { color: var(--slate-300); font-size: 0.95rem; line-height: 1.7; margin-bottom: 1rem; }
    .prose img { width: 100%; height: auto; object-fit: contain; border-radius: 0.5rem; margin: 1rem 0; }
  </style>
</head>
<body>

  <!-- TOP EXTRA SECTIONS BAR -->
  <div class="top-sections">
    <div class="container" style="display: flex; justify-content: space-between; overflow-x: auto;">
      <div>
        <span style="color: var(--cyan);"><i class="fa-solid fa-bolt"></i> SECTIONS:</span>
        <a href="/category/ai" onclick="setCategory('AI', event)">AI</a>
        <a href="/category/tech" onclick="setCategory('Tech', event)">Frontier Tech</a>
        <a href="/category/cybersecurity" onclick="setCategory('Cybersecurity', event)">Cybersecurity</a>
        <a href="/category/software" onclick="setCategory('Software', event)">Software</a>
      </div>
    </div>
  </div>

  <!-- Header Section -->
  <header>
    <div class="container nav-wrapper">
      <a href="/" onclick="navigateToHome(event)" class="brand-logo">
        AZEX<span class="highlight">AI</span><span class="dot">.</span>
      </a>

      <div id="headerCategories" class="no-scrollbar" style="display: flex; gap: 1rem; font-size: 0.85rem; font-weight: bold;">
        <!-- Dynamic -->
      </div>
    </div>
  </header>

  <!-- Dynamic Content Area -->
  <main class="container" style="padding-top: 1.5rem; padding-bottom: 2rem; flex-grow: 1;">
    <div id="app"></div>
  </main>

  <script>
    const BLOGGER_CONFIG = {
      blogId: '4263033619836681299',
      apiKey: 'AIzaSyBCX4A-E72kxv4_m-z-mr0lfl7Nll9mjGQ',
      maxResults: 20
    };

    let AZEXAI = { categories: ['All'], activeCategory: 'All' };
    let ARTICLES = [];
    const DEFAULT_IMAGE = 'https://images.pexels.com/photos/8386440/pexels-photo-8386440.jpeg?auto=compress&cs=tinysrgb&w=800';

    function stripHtml(html) {
      const div = document.createElement('div');
      div.innerHTML = html || '';
      return (div.textContent || div.innerText || '').replace(/\s+/g, ' ').trim();
    }

    function getFirstImage(html) {
      const div = document.createElement('div');
      div.innerHTML = html || '';
      const img = div.querySelector('img');
      return img ? img.src : '';
    }

    function normalizeBloggerPost(post, index) {
      const labels = Array.isArray(post.labels) ? post.labels : [];
      const rawBody = post.content || '';
      const plainText = stripHtml(rawBody);

      return {
        id: String(post.id || index + 1),
        slug: (post.url || '').match(/[^/]+$/)?.[0]?.replace(/\.html$/, '') || String(post.id),
        title: post.title || 'Untitled Article',
        category: labels[0] || 'General',
        author: 'Azex',
        date: post.published ? new Date(post.published).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '2026',
        readTime: Math.max(1, Math.ceil(plainText.split(/\s+/).length / 200)) + ' min',
        image: getFirstImage(rawBody) || DEFAULT_IMAGE,
        excerpt: plainText.length > 120 ? plainText.substring(0, 120) + '...' : plainText,
        content: rawBody
      };
    }

    async function loadBloggerArticles() {
      try {
        const url = `https://www.googleapis.com/blogger/v3/blogs/${BLOGGER_CONFIG.blogId}/posts?key=${encodeURIComponent(BLOGGER_CONFIG.apiKey)}&fetchBodies=true&maxResults=${BLOGGER_CONFIG.maxResults}`;
        const response = await fetch(url);
        if (!response.ok) throw new Error('Network response error');
        const data = await response.json();
        
        if (Array.isArray(data.items)) {
          ARTICLES = data.items.map(normalizeBloggerPost);
          const catSet = new Set(['All']);
          ARTICLES.forEach(art => catSet.add(art.category));
          AZEXAI.categories = Array.from(catSet);
          renderHeaderCategories();
          return true;
        }
      } catch (err) {
        console.error('Fetch error:', err);
      }
      return false;
    }

    function renderHeaderCategories() {
      const nav = document.getElementById('headerCategories');
      if (!nav) return;
      nav.innerHTML = AZEXAI.categories.slice(0, 5).map(cat => `
        <a href="/category/${cat.toLowerCase()}" onclick="setCategory('${cat}', event)" style="color:${AZEXAI.activeCategory === cat ? 'var(--cyan)' : '#cbd5e1'}; text-decoration:none;">${cat}</a>
      `).join('');
    }

    function navigateToHome(e) {
      if (e) e.preventDefault();
      AZEXAI.activeCategory = 'All';
      window.history.pushState(null, '', '/');
      renderHome();
    }

    function navigateToArticle(slug, e) {
      if (e) e.preventDefault();
      const article = ARTICLES.find(a => a.slug === slug);
      if (article) renderArticleView(article);
    }

    function setCategory(cat, e) {
      if (e) e.preventDefault();
      AZEXAI.activeCategory = cat;
      renderHome();
    }

    function renderHome() {
      const app = document.getElementById('app');
      const filtered = ARTICLES.filter(a => AZEXAI.activeCategory === 'All' || a.category === AZEXAI.activeCategory);
      const latestArticle = ARTICLES[0];

      app.innerHTML = `
        ${latestArticle && AZEXAI.activeCategory === 'All' ? `
          <div onclick="navigateToArticle('${latestArticle.slug}', event)" class="hero-card" style="cursor:pointer;">
            <div class="hero-grid">
              <div>
                <span style="font-size:10px; background:var(--cyan-bright); color:#fff; padding:2px 8px; border-radius:4px; font-weight:bold;">LATEST DISPATCH</span>
                <h2 style="font-size:1.5rem; margin:0.5rem 0; color:#fff;">${latestArticle.title}</h2>
                <p style="font-size:0.85rem; color:var(--slate-300);">${latestArticle.excerpt}</p>
              </div>
              <div class="card-img-wrapper" style="border-radius:0.5rem; overflow:hidden;">
                <img src="${latestArticle.image}" alt="${latestArticle.title}" loading="eager">
              </div>
            </div>
          </div>
        ` : ''}

        <div class="article-grid">
          ${filtered.map(art => `
            <div onclick="navigateToArticle('${art.slug}', event)" class="card" style="cursor:pointer;">
              <div class="card-img-wrapper">
                <img src="${art.image}" alt="${art.title}" loading="lazy">
              </div>
              <div class="card-body">
                <div class="card-title">${art.title}</div>
                <div class="card-excerpt">${art.excerpt}</div>
                <div style="font-size:10px; color:var(--slate-400); margin-top:auto;">${art.date} • <span style="color:var(--cyan);">${art.readTime}</span></div>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderArticleView(art) {
      const app = document.getElementById('app');
      app.innerHTML = `
        <div style="max-width: 768px; margin:0 auto;">
          <button onclick="navigateToHome(event)" style="background:none; border:none; color:var(--cyan); font-weight:bold; cursor:pointer; margin-bottom:1rem;">← BACK TO HOMEPAGE</button>
          <h1 style="font-size: 1.8rem; color:#fff; margin-bottom:1rem;">${art.title}</h1>
          <div style="font-size:12px; color:var(--slate-400); margin-bottom:1.5rem;">${art.author} • ${art.date}</div>
          <div class="card-img-wrapper" style="margin-bottom:1.5rem; border-radius:0.5rem; overflow:hidden;">
            <img src="${art.image}" alt="${art.title}">
          </div>
          <article class="prose">${art.content}</article>
        </div>
      `;
    }

    (async function init() {
      document.getElementById('app').innerHTML = '<div style="text-align:center; padding:3rem; color:#fff;">Loading...</div>';
      await loadBloggerArticles();
      renderHome();
    })();
  </script>
</body>
</html>
