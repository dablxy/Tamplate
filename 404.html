​// Helper Functions
const normalizeCategory = (labels = []) => {
if (!labels || labels.length === 0) return CONFIG.DEFAULT_CATEGORY;
const lowerLabels = labels.map(l => String(l).toLowerCase());
for (const [category, keywords] of Object.entries(CATEGORY_MAPPINGS)) {
for (const keyword of keywords) {
if (lowerLabels.some(l => l.includes(keyword))) return category;
}
}
return labels[0] || CONFIG.DEFAULT_CATEGORY;
};
​const calculateReadingTime = (contentHtml) => {
const text = (contentHtml || '').replace(/<[^>]*>/g, '');
const wordCount = text.trim().split(/\s+/).length;
const time = Math.ceil(wordCount / 200);
return time < 1 ? 1 : time;
};
​const extractFirstImage = (contentHtml) => {
if (!contentHtml) return null;
const match = contentHtml.match(/<img[^>]+src="([^">]+)"/i);
return match ? match[1] : null;
};
​const createExcerpt = (contentHtml, maxLength = 160) => {
if (!contentHtml) return "";
const plainText = contentHtml.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
if (plainText.length <= maxLength) return plainText;
return plainText.substring(0, maxLength).trim() + "...";
};
​const formatDate = (dateString) => {
if (!dateString) return "Editorial Issue";
try {
const d = new Date(dateString);
return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
} catch (e) {
return dateString;
}
};
​const normalizeFeedEntry = (entry) => {
const id = entry.id?.$t || Math.random().toString();
const title = entry.title?.$t || "Untitled Dispatch";
const content = entry.content?.$t \vert{}\vert{} entry.summary?.$t || "";
const publishedAt = entry.published?.$t || new Date().toISOString();
const author = entry.author?.[0]?.name?.t || "AZEXAI Editorial Desk";
const rawCategories = entry.category ? entry.category.map(c => c.term) : [];
const category = normalizeCategory(rawCategories);
const excerpt = createExcerpt(content, 180);
const featuredImage = extractFirstImage(content) || "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=1200&q=80";
const slug = title ? title.toLowerCase().replace(/[^a-z0-9\u0600-\u06FF]+/g, '-').replace(/(^-|-)/g, '') : id;
​return {
id, title, slug: slug || id, excerpt, content, featuredImage, author,
publishedAt, labels: rawCategories, category, readingTime: calculateReadingTime(content)
};
};
​async function fetchAllPublicBloggerPosts(blogId) {
let allEntries = [];
let startIndex = 1;
const maxResults = 150;
let keepFetching = true;
​while (keepFetching && allEntries.length < 3000) {
const feedUrl = https://www.blogger.com/feeds/${blogId}/posts/default?alt=json&start-index=${startIndex}&max-results=${maxResults};
try {
const res = await fetch(feedUrl);
if (!res.ok) break;
const data = await res.json();
const entries = data.feed?.entry || [];
if (entries.length === 0) {
keepFetching = false;
} else {
allEntries.push(...entries.map(normalizeFeedEntry));
if (entries.length < maxResults) keepFetching = false;
else startIndex += maxResults;
}
} catch (e) {
break;
}
}
return allEntries;
}

<h3 className="font-mono text-xs font-bold uppercase tracking-widest text-stone-900 dark:text-stone-100 flex items-center justify-between">
<span>EDITORIAL SELECTION</span>
<SparklesIcon className="w-3.5 h-3.5 text-amber-700" />
</h3>
</div>
<div className="divide-y divide-stone-300 dark:divide-stone-800 space-y-4">
{secondaryStories.map((story) => (
<article key={story.id} onClick={() => navigateTo(/blog/${story.slug})} className="pt-3 first:pt-0 group cursor-pointer">
<span className="font-mono text-[10px] font-bold uppercase text-amber-800 dark:text-amber-400 tracking-wider">{story.category}</span>
<h4 className="font-serif text-base font-bold text-stone-950 dark:text-stone-100 group-hover:text-amber-800 leading-snug transition-colors mt-0.5">{story.title}</h4>
<p className="font-serif text-xs text-stone-600 dark:text-stone-400 line-clamp-2 mt-1">{story.excerpt}</p>
</article>
))}
</div>
</div>
</section>
​<section className="space-y-6">
<div className="flex items-center justify-between border-b-2 border-stone-900 dark:border-stone-100 pb-2">
<h3 className="font-serif text-2xl font-extrabold text-stone-950 dark:text-stone-50 flex items-center gap-2">
<LayersIcon className="w-5 h-5 text-amber-700" />
ALL PUBLISHED DISPATCHES ({gridArticles.length} OF {articles.length})
</h3>
</div>
<div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
{gridArticles.map((article) => (
<ArticleCard key={article.id} article={article} navigateTo={navigateTo} isBookmarked={bookmarks.includes(article.id)} onToggleBookmark={toggleBookmark} />
))}
</div>
{visibleCount < articles.length && (
<div className="text-center pt-6">
<button
onClick={() => setVisibleCount(prev => Math.min(prev + 12, articles.length))}
className="px-6 py-3 bg-stone-900 dark:bg-stone-100 text-stone-100 dark:text-stone-900 font-mono text-xs font-bold uppercase border hover:bg-amber-700 transition-colors"
>
Load More Articles ({articles.length - visibleCount} Remaining)
</button>
</div>
)}
</section>
</div>
);
}
​function ArticlePageView({ article, navigateTo }) {
return (
<div className="max-w-4xl mx-auto space-y-8">
<button onClick={() => navigateTo('/')} className="font-mono text-xs text-amber-800 dark:text-amber-400 font-bold hover:underline flex items-center gap-1">
<ArrowLeftIcon className="w-3.5 h-3.5" /> Return to Front Page
</button>
<header className="space-y-4 border-b border-stone-300 dark:border-stone-800 pb-6">
<span className={inline-block font-mono text-xs font-bold uppercase tracking-wider px-2.5 py-1 border ${CATEGORY_STYLES[article.category] || CATEGORY_STYLES["Technology"]}}>
{article.category}
</span>
<h1 className="font-serif text-3xl sm:text-5xl font-extrabold text-stone-950 dark:text-stone-50 leading-tight">
{article.title}
</h1>
<p className="font-serif text-lg text-stone-700 dark:text-stone-300 italic leading-relaxed">
{article.excerpt}
</p>
</header>
<div className="relative aspect-[16/9] w-full bg-stone-950 border border-stone-300 dark:border-stone-800 overflow-hidden flex items-center justify-center">
<img src={article.featuredImage} alt={article.title} className="max-h-full max-w-full object-contain" />
</div>
<article className="font-serif text-stone-900 dark:text-stone-100 text-base sm:text-lg leading-relaxed space-y-4" dangerouslySetInnerHTML={{ __html: article.content }} />
</div>

}
​function App() {
const [articles, setArticles] = useState([]);
const [loading, setLoading] = useState(true);
const [blogId, setBlogId] = useState(CONFIG.BLOGGER_BLOG_ID);
const [currentPath, setCurrentPath] = useState('/');
const [searchQuery, setSearchQuery] = useState('');
const [darkMode, setDarkMode] = useState(false);
const [bookmarks, setBookmarks] = useState([]);
const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
​const navigateTo = (path) => {
setCurrentPath(path);
setMobileMenuOpen(false);
window.scrollTo({ top: 0, behavior: 'smooth' });
};
​useEffect(() => {
async function loadAllPosts() {
setLoading(true);
let fetchedPosts = [];
try {
const feedPosts = await fetchAllPublicBloggerPosts(blogId);
if (feedPosts.length > 0) fetchedPosts = feedPosts;
} catch (e) {}
​if (fetchedPosts.length === 0) fetchedPosts = FALLBACK_BLOGGER_POSTS;
​const uniqueMap = new Map();
fetchedPosts.forEach(p => uniqueMap.set(p.id || p.title, p));
const sorted = Array.from(uniqueMap.values()).sort((a, b) => new Date(b.publishedAt).getTime() - new Date(a.publishedAt).getTime());
​setArticles(sorted);
setLoading(false);
}
loadAllPosts();
}, [blogId]);
​useEffect(() => {
if (darkMode) document.documentElement.classList.add('dark');
else document.documentElement.classList.remove('dark');
}, [darkMode]);
​const isHome = currentPath === '/';
const isArticle = currentPath.startsWith('/blog/');
const activeArticleSlug = isArticle ? currentPath.replace('/blog/', '') : null;
const selectedArticle = isArticle ? articles.find(a => a.slug === activeArticleSlug) || articles[0] : null;
​const toggleBookmark = (id) => {
setBookmarks(prev => prev.includes(id) ? prev.filter(b => b !== id) : [...prev, id]);
};
​return (
<div className="min-h-screen bg-[#FAF8F5] text-stone-900 dark:bg-stone-950 dark:text-stone-100 font-serif antialiased">
<TopUtilityBar darkMode={darkMode} setDarkMode={setDarkMode} searchQuery={searchQuery} setSearchQuery={setSearchQuery} onSearchSubmit={(e) => { e.preventDefault(); }} />
<PublicationHeader currentPath={currentPath} navigateTo={navigateTo} mobileMenuOpen={mobileMenuOpen} setMobileMenuOpen={setMobileMenuOpen} articleCount={articles.length} />
​<main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
{loading ? (
<div className="p-8 text-center font-mono text-xs">Loading AZEXAI Intelligence Stream...</div>
) : (
<>
{isHome && <HomePageView articles={articles} navigateTo={navigateTo} bookmarks={bookmarks} toggleBookmark={toggleBookmark} />}
{isArticle && selectedArticle && <ArticlePageView article={selectedArticle} navigateTo={navigateTo} />}
</>
)}
</main>
​<footer className="bg-stone-900 text-stone-300 border-t-4 border-stone-800 py-8 font-sans text-xs text-center font-mono">
© {new Date().getFullYear()} AZEXAI Journal. All rights reserved.
</footer>
</div>
);
}
​const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
