<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageMetaTitle">AZEXAI — Global Technology & Artificial Intelligence Authority</title>
  <meta id="pageMetaDesc" name="description" content="Global authority on artificial intelligence, frontier technology, software architecture, and digital transformation.">
  <link id="pageCanonical" rel="canonical" href="">

  <!-- Preconnects for Speed Optimization -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://images.pexels.com">
  <link rel="preconnect" href="https://cdn.tailwindcss.com">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">

  <!-- Open Graph & Twitter Meta Tags -->
  <meta id="ogTitle" property="og:title" content="AZEXAI — Global Technology & Artificial Intelligence Authority">
  <meta id="ogDesc" property="og:description" content="Global authority on artificial intelligence, frontier technology, and digital transformation.">
  <meta id="ogImage" property="og:image" content="https://images.pexels.com/photos/8386440/pexels-photo-8386440.jpeg?auto=compress&cs=tinysrgb&w=1200">
  <meta id="ogUrl" property="og:url" content="">
  <meta property="og:type" content="website">

  <!-- Tailwind CSS Engine -->
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              orange: '#f97316',
              red: '#ef4444',
              darkBg: '#050505',
              cardBg: '#0a0a0a'
            }
          }
        }
      }
    }
  </script>

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    *, ::before, ::after { box-sizing: border-box; border-style: none !important; }
    
    html, body, div, span, p, a, h1, h2, h3, h4, h5, h6, article, section, figure, img, button, input {
      font-style: normal !important;
      transform: none !important;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif !important;
    }

    body {
      background-color: #050505;
      color: #f8fafc;
      margin: 0;
      padding: 0;
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Clean Card Style with Absolutely No Borders */
    .clean-card {
      background: #0d0d0d;
      border: none !important;
      outline: none !important;
      box-shadow: none !important;
    }

    .prose * {
      font-style: normal !important;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
      border: none !important;
    }
    .prose h1, .prose h2, .prose h3, .prose h4 {
      color: #ffffff !important;
      font-weight: 800 !important;
      margin-top: 1.5rem !important;
      margin-bottom: 0.75rem !important;
      line-height: 1.3 !important;
    }
    .prose p {
      color: #cbd5e1 !important;
      font-size: 0.95rem !important;
      line-height: 1.7 !important;
      margin-bottom: 1.25rem !important;
    }
    .prose img {
      max-width: 100%;
      height: auto;
      border-radius: 0.75rem;
      margin: 1.5rem 0;
      border: none !important;
    }
    .prose a { color: #f97316; text-decoration: none; font-weight: 700; }
    .prose a:hover { color: #ffffff; text-decoration: underline; }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-[#050505] text-slate-100">

  <!-- Header Section without Borders -->
  <header class="sticky top-0 z-50 bg-black/95 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 h-16 sm:h-20 flex items-center justify-between gap-4">
      
      <!-- Brand Logo -->
      <a href="/" onclick="navigateToHome(event)" class="flex items-center group shrink-0" aria-label="AZEXAI Homepage">
        <span class="text-xl sm:text-3xl font-black tracking-tighter uppercase text-white">AZEX<span class="text-orange-500">AI</span><span class="text-red-500 text-2xl sm:text-4xl leading-none">.</span></span>
      </a>

      <!-- Dynamic Navigation Categories -->
      <nav id="headerCategories" class="hidden md:flex items-center gap-4 lg:gap-6 text-xs sm:text-sm font-bold tracking-wide text-slate-300 overflow-x-auto no-scrollbar" aria-label="Global Navigation">
        <!-- Generated Dynamically via JS -->
      </nav>
      
      <!-- Header Actions -->
      <div class="flex items-center gap-2">
        <button onclick="openSearchModal()" class="p-2 sm:p-2.5 rounded-xl bg-neutral-900 text-slate-200 hover:text-white transition" aria-label="Search Articles">
          <i class="fa-solid fa-magnifying-glass text-xs sm:text-base"></i>
        </button>
        <button onclick="navigateToStaticPage('contact', event)" class="flex items-center gap-1.5 px-3 sm:px-4 py-2 bg-gradient-to-r from-orange-500 to-red-600 hover:from-red-600 hover:to-orange-500 text-white text-[11px] sm:text-xs font-black uppercase tracking-wider rounded-xl transition">
          <i class="fa-solid fa-paper-plane text-[10px]"></i>
          <span>Contact</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Dynamic Content Area -->
  <main class="flex-grow max-w-7xl mx-auto px-2 sm:px-6 lg:px-8 py-3 sm:py-6 w-full">
    <div id="app"></div>
  </main>

  <!-- Clean Minimal Global Footer -->
  <footer class="bg-black py-10 sm:py-14 text-xs text-slate-400 mt-12">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-8">
      <div class="flex flex-col md:flex-row items-center justify-between gap-6">
        <div class="space-y-2 text-center md:text-left">
          <span class="text-2xl font-black uppercase text-white">AZEX<span class="text-orange-500">AI</span>.</span>
          <p class="max-w-md text-slate-400">Global authority on artificial intelligence, software architecture, and digital transformation.</p>
        </div>
        <div class="flex items-center gap-4">
          <a href="/about" onclick="navigateToStaticPage('about', event)" class="hover:text-white transition">About</a>
          <a href="/editorial" onclick="navigateToStaticPage('editorial', event)" class="hover:text-white transition">Editorial Board</a>
          <a href="/privacy" onclick="navigateToStaticPage('privacy', event)" class="hover:text-white transition">Privacy Policy</a>
          <a href="/terms" onclick="navigateToStaticPage('terms', event)" class="hover:text-white transition">Terms</a>
          <a href="/contact" onclick="navigateToStaticPage('contact', event)" class="hover:text-white transition">Contact</a>
        </div>
      </div>
      <div class="text-center text-slate-600 text-[11px]">
        © 2026 AZEXAI Authority. All Rights Reserved.
      </div>
    </div>
  </footer>

  <!-- Search Modal -->
  <div id="searchModal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 flex items-start justify-center p-4 pt-16 sm:pt-24 hidden">
    <div class="bg-neutral-900 rounded-2xl max-w-2xl w-full p-4 sm:p-6 text-white">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-sm sm:text-base font-black uppercase tracking-wider">Search Articles</h3>
        <button onclick="closeSearchModal()" class="text-slate-400 hover:text-white p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <div class="relative mb-4">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500"></i>
        <input type="text" id="modalSearchInput" oninput="handleModalSearch(event)" placeholder="Search all articles..." class="w-full pl-10 pr-4 py-2.5 bg-neutral-950 rounded-xl text-xs sm:text-sm focus:outline-none text-white">
      </div>
      <div id="modalSearchResults" class="max-h-72 overflow-y-auto space-y-2 no-scrollbar"></div>
    </div>
  </div>

  <!-- Main JS Engine -->
  <script>
    const CONTACT_EMAIL = "aristo@azexai.com";

    // Blogger Config API
    const BLOGGER_CONFIG = {
      blogId: '4263033619836681299',
      apiKey: 'AIzaSyBCX4A-E72kxv4_m-z-mr0lfl7Nll9mjGQ',
      maxResults: 500
    };

    let AZEXAI = {
      categories: ['All'],
      activeCategory: 'All'
    };

    let ARTICLES = [];

    const DEFAULT_IMAGE = 'https://images.pexels.com/photos/8386440/pexels-photo-8386440.jpeg?auto=compress&cs=tinysrgb&w=1200';

    function sanitizeText(text) {
      if (!text) return '';
      return text
        .replace(/Karim Ouzinba/gi, 'Azex')
        .replace(/Karim/gi, 'Azex')
        .replace(/Ouzinba/gi, 'Azex')
        .replace(/<em>/gi, '<span>')
        .replace(/<\/em>/gi, '</span>')
        .replace(/<i>/gi, '<span>')
        .replace(/<\/i>/gi, '</span>');
    }

    function stripHtml(html) {
      const div = document.createElement('div');
      div.innerHTML = html || '';
      return (div.textContent || div.innerText || '').replace(/\s+/g, ' ').trim();
    }

    function getFirstImage(html) {
      const div = document.createElement('div');
      div.innerHTML = html || '';
      const img = div.querySelector('img');
      return img ? (img.src || img.getAttribute('data-src') || '') : '';
    }

    function estimateReadTime(html) {
      const text = stripHtml(html);
      const words = text.split(/\s+/).filter(Boolean).length;
      return Math.max(1, Math.ceil(words / 200)) + ' min read';
    }

    function bloggerSlug(post) {
      const match = (post.url || '').match(/[^/]+$/);
      return match ? decodeURIComponent(match[0]).replace(/\.html$/, '') : String(post.id);
    }

    function normalizeBloggerPost(post, index) {
      const labels = Array.isArray(post.labels) ? post.labels : [];
      const category = labels[0] || 'General';
      const rawBody = sanitizeText(post.content || '');
      const plainText = stripHtml(rawBody);
      const image = getFirstImage(rawBody) || DEFAULT_IMAGE;
      const date = post.published ? new Date(post.published).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }) : '2026';

      return {
        id: String(post.id || index + 1),
        slug: bloggerSlug(post),
        title: sanitizeText(post.title || 'Untitled Article'),
        category: category,
        author: 'Azex',
        date: date,
        readTime: estimateReadTime(rawBody),
        image: image,
        excerpt: plainText.length > 120 ? plainText.substring(0, 120) + '...' : plainText,
        tags: labels,
        content: rawBody
      };
    }

    async function loadBloggerArticles() {
      try {
        const url = `https://www.googleapis.com/blogger/v3/blogs/${BLOGGER_CONFIG.blogId}/posts?key=${encodeURIComponent(BLOGGER_CONFIG.apiKey)}&fetchBodies=true&fetchImages=true&maxResults=${BLOGGER_CONFIG.maxResults}`;
        const response = await fetch(url);
        if (!response.ok) throw new Error('HTTP Error ' + response.status);
        const data = await response.json();
        
        if (Array.isArray(data.items) && data.items.length > 0) {
          ARTICLES = data.items.map(normalizeBloggerPost);
          
          // Extract All Categories automatically from Blogger Labels
          const catSet = new Set(['All']);
          ARTICLES.forEach(art => {
            if (art.category) catSet.add(art.category);
            if (Array.isArray(art.tags)) {
              art.tags.forEach(t => catSet.add(t));
            }
          });
          AZEXAI.categories = Array.from(catSet);
          renderHeaderCategories();
          return true;
        }
      } catch (err) {
        console.error('Failed to load Blogger articles:', err);
      }
      return false;
    }

    function renderHeaderCategories() {
      const nav = document.getElementById('headerCategories');
      if (!nav) return;
      nav.innerHTML = AZEXAI.categories.slice(0, 7).map(cat => `
        <a href="/category/${cat.toLowerCase()}" onclick="setCategory('${cat}', event)" class="hover:text-orange-500 transition whitespace-nowrap ${AZEXAI.activeCategory === cat ? 'text-orange-500' : ''}">${cat}</a>
      `).join('');
    }

    // ================= Routing System =================
    let currentView = { type: 'home', slug: null };

    function navigateToHome(e) {
      if (e) e.preventDefault();
      currentView = { type: 'home', slug: null };
      AZEXAI.activeCategory = 'All';
      window.history.pushState(null, '', '/');
      window.scrollTo({ top: 0, behavior: 'smooth' });
      router();
    }

    function navigateToArticle(slug, e) {
      if (e) e.preventDefault();
      currentView = { type: 'article', slug: String(slug) };
      window.history.pushState(null, '', '/article/' + encodeURIComponent(slug));
      window.scrollTo({ top: 0, behavior: 'smooth' });
      router();
    }

    function navigateToStaticPage(pageSlug, e) {
      if (e) e.preventDefault();
      currentView = { type: 'static', slug: pageSlug };
      window.history.pushState(null, '', '/' + pageSlug);
      window.scrollTo({ top: 0, behavior: 'smooth' });
      router();
    }

    function setCategory(cat, e) {
      if (e) e.preventDefault();
      AZEXAI.activeCategory = cat;
      currentView = { type: 'home', slug: null };
      const targetPath = cat === 'All' ? '/' : '/category/' + encodeURIComponent(cat.toLowerCase());
      window.history.pushState(null, '', targetPath);
      window.scrollTo({ top: 0, behavior: 'smooth' });
      router();
    }

    function parseUrlRoute() {
      const path = window.location.pathname;
      if (path.startsWith('/article/')) {
        const slug = decodeURIComponent(path.replace('/article/', ''));
        currentView = { type: 'article', slug: slug };
      } else if (path.startsWith('/category/')) {
        const catSlug = decodeURIComponent(path.replace('/category/', ''));
        const matched = AZEXAI.categories.find(c => c.toLowerCase() === catSlug.toLowerCase());
        if (matched) AZEXAI.activeCategory = matched;
        currentView = { type: 'home', slug: null };
      } else if (['/contact', '/about', '/privacy', '/terms', '/editorial'].includes(path)) {
        currentView = { type: 'static', slug: path.replace('/', '') };
      } else {
        currentView = { type: 'home', slug: null };
        AZEXAI.activeCategory = 'All';
      }
    }

    window.addEventListener('popstate', () => {
      parseUrlRoute();
      router();
    });

    document.addEventListener('click', function(e) {
      const articleEl = e.target.closest('[data-article-slug]');
      if (articleEl) {
        const slug = articleEl.getAttribute('data-article-slug');
        if (slug) navigateToArticle(slug, e);
      }
    });

    function openSearchModal() {
      document.getElementById('searchModal').classList.remove('hidden');
      setTimeout(() => document.getElementById('modalSearchInput').focus(), 100);
    }

    function closeSearchModal() {
      document.getElementById('searchModal').classList.add('hidden');
    }

    function handleModalSearch(e) {
      const query = e.target.value.toLowerCase().trim();
      const resultsContainer = document.getElementById('modalSearchResults');
      if (!query) { resultsContainer.innerHTML = ''; return; }

      const matches = ARTICLES.filter(a => 
        a.title.toLowerCase().includes(query) || 
        a.excerpt.toLowerCase().includes(query) ||
        a.category.toLowerCase().includes(query)
      );

      if (matches.length === 0) {
        resultsContainer.innerHTML = '<p class="text-xs text-slate-500 text-center py-4">No matching articles found.</p>';
        return;
      }

      resultsContainer.innerHTML = matches.map(m => `
        <div data-article-slug="${m.slug}" onclick="closeSearchModal(); navigateToArticle('${m.slug}', event)" class="p-3 bg-neutral-950 rounded-xl cursor-pointer hover:bg-neutral-800 transition">
          <h4 class="text-xs font-bold text-white line-clamp-1">${m.title}</h4>
          <p class="text-[10px] text-slate-400 line-clamp-1">${m.excerpt}</p>
        </div>
      `).join('');
    }

    function router() {
      renderHeaderCategories();
      const app = document.getElementById('app');
      if (!app) return;

      if (currentView.type === 'article') {
        const article = ARTICLES.find(a => a.slug.toLowerCase() === currentView.slug.toLowerCase() || a.id === currentView.slug);
        if (article) {
          renderArticleView(article);
          return;
        }
      } else if (currentView.type === 'static') {
        renderStaticPageView(currentView.slug);
        return;
      }
      renderHome();
    }

    // Modern Main Home Layout Grid: 2 columns in Mobile, 3 columns in Desktop, No Frames
    function renderHome() {
      const app = document.getElementById('app');
      const filtered = ARTICLES.filter(a => {
        if (AZEXAI.activeCategory === 'All') return true;
        return a.category.toLowerCase() === AZEXAI.activeCategory.toLowerCase() ||
               (Array.isArray(a.tags) && a.tags.some(t => t.toLowerCase() === AZEXAI.activeCategory.toLowerCase()));
      });

      app.innerHTML = `
        <!-- Categories Bar -->
        <div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-2 mb-4">
          ${AZEXAI.categories.map(cat => `
            <button onclick="setCategory('${cat}', event)" class="px-3 py-1.5 rounded-lg text-[10px] sm:text-xs font-bold uppercase tracking-wider whitespace-nowrap transition ${AZEXAI.activeCategory === cat ? 'bg-orange-500 text-white' : 'bg-neutral-900 text-slate-400 hover:text-white'}">${cat}</button>
          `).join('')}
        </div>

        <!-- Headline Article Count -->
        <div class="mb-4 text-xs font-bold uppercase text-slate-400 flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-orange-500"></span>
          <span>${AZEXAI.activeCategory} (${filtered.length} Articles)</span>
        </div>

        <!-- Strict Grid Requirement: 2 items per line on Mobile, 3 items per line on Desktop, Zero Frames/Borders -->
        <div class="grid grid-cols-2 lg:grid-cols-3 gap-3 sm:gap-6">
          ${filtered.map(art => `
            <div data-article-slug="${art.slug}" onclick="navigateToArticle('${art.slug}', event)" class="clean-card rounded-xl overflow-hidden flex flex-col cursor-pointer group">
              <!-- No image frames -->
              <div class="aspect-[16/10] bg-neutral-950 relative overflow-hidden">
                <img src="${art.image}" alt="${art.title}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                <span class="absolute top-2 left-2 px-2 py-0.5 bg-black/80 text-orange-400 text-[9px] font-bold uppercase rounded">${art.category}</span>
              </div>
              <div class="p-2 sm:p-4 flex flex-col flex-grow">
                <h3 class="text-xs sm:text-base font-bold text-white mb-1 group-hover:text-orange-400 transition line-clamp-2 leading-snug">${art.title}</h3>
                <p class="text-[10px] sm:text-xs text-slate-400 line-clamp-2 mb-2 flex-grow leading-relaxed">${art.excerpt}</p>
                <div class="flex items-center justify-between text-[9px] sm:text-[10px] text-slate-500 font-medium">
                  <span>${art.date}</span>
                  <span class="text-emerald-400">${art.readTime}</span>
                </div>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderArticleView(art) {
      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="max-w-3xl mx-auto py-4">
          <button onclick="navigateToHome(event)" class="text-xs font-bold uppercase text-slate-400 hover:text-orange-500 mb-4 inline-flex items-center gap-1">
            <i class="fa-solid fa-arrow-left"></i> Back to Articles
          </button>
          <span class="px-2.5 py-1 bg-orange-500/20 text-orange-400 font-bold text-[10px] uppercase rounded">${art.category}</span>
          <h1 class="text-xl sm:text-3xl font-black text-white mt-3 mb-4 leading-tight">${art.title}</h1>
          <div class="flex items-center gap-3 text-xs text-slate-400 mb-6">
            <span>By ${art.author}</span>
            <span>•</span>
            <span>${art.date}</span>
            <span>•</span>
            <span class="text-emerald-400">${art.readTime}</span>
          </div>
          <div class="aspect-[16/9] rounded-xl overflow-hidden mb-6 bg-neutral-950">
            <img src="${art.image}" alt="${art.title}" class="w-full h-full object-cover">
          </div>
          <article class="prose prose-invert max-w-none text-slate-300">${art.content}</article>
        </div>
      `;
    }

    function renderStaticPageView(slug) {
      const app = document.getElementById('app');
      if (slug === 'contact') {
        app.innerHTML = `
          <div class="max-w-xl mx-auto py-6">
            <h1 class="text-2xl font-black text-white mb-2 uppercase">Contact Editorial Desk</h1>
            <p class="text-xs text-slate-400 mb-6">Reach out directly to AZEXAI global team via official email address: <a href="mailto:${CONTACT_EMAIL}" class="text-orange-400 font-bold">${CONTACT_EMAIL}</a></p>
            <form onsubmit="event.preventDefault(); window.location.href='mailto:${CONTACT_EMAIL}'; " class="space-y-3">
              <input type="text" placeholder="Your Name" required class="w-full p-3 bg-neutral-900 rounded-xl text-xs text-white focus:outline-none">
              <input type="email" placeholder="Your Email" required class="w-full p-3 bg-neutral-900 rounded-xl text-xs text-white focus:outline-none">
              <textarea rows="4" placeholder="Your Message" required class="w-full p-3 bg-neutral-900 rounded-xl text-xs text-white focus:outline-none"></textarea>
              <button type="submit" class="w-full py-3 bg-gradient-to-r from-orange-500 to-red-600 text-white text-xs font-black uppercase rounded-xl">Send Message</button>
            </form>
          </div>
        `;
        return;
      }
      app.innerHTML = `
        <div class="max-w-2xl mx-auto py-6 text-slate-300">
          <h1 class="text-2xl font-black text-white mb-4 uppercase">${slug}</h1>
          <p class="text-xs leading-relaxed">Official page content for AZEXAI global technology network.</p>
        </div>
      `;
    }

    (async function init() {
      const app = document.getElementById('app');
      app.innerHTML = '<div class="min-h-[50vh] grid place-items-center text-xs font-bold text-white uppercase"><i class="fa-solid fa-spinner fa-spin text-2xl text-orange-500 mb-2"></i>Fetching All Blogger Posts...</div>';
      
      await loadBloggerArticles();
      parseUrlRoute();
      router();
    })();
  </script>
</body>
</html>
